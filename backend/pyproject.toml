[project]
name = "customs-document-intelligence-backend"
version = "0.1.0"
description = "Customs document extraction and review platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0.9,<1",
  "python-jose[cryptography]>=3.3,<4",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pymupdf>=1.24,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
processing = ["pymupdf>=1.24,<2", "pillow>=10,<12", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "paddleocr>=2.9,<3"]
export = ["pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
